<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Skakmat — Raja Nggak Mau Kalah</title>
<link rel="stylesheet" href="./node_modules/@fontsource/anton/index.css">
<link rel="stylesheet" href="./node_modules/@fontsource/bebas-neue/index.css">

<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/",
  "gsap": "./node_modules/gsap/index.js",
  "gsap/": "./node_modules/gsap/"
} }
</script>
<style>
  html, body { margin: 0; background: #000; }
  #mg-root { position: relative; width: var(--W); height: var(--H); overflow: hidden; background: #120f18; }
  .layer { position: absolute; inset: 0; }
  #backdrop { background:
      radial-gradient(38% 22% at 82% 18%, rgba(255,70,170,.28) 0%, transparent 100%),
      radial-gradient(70% 45% at 50% 35%, #3a2c48 0%, #1c1727 58%, #0c0a11 100%); }
  #gl { width: 100%; height: 100%; display: block; }
  #vignette { background: radial-gradient(120% 85% at 50% 45%, transparent 50%, rgba(0,0,0,.6) 100%); pointer-events: none; }
  #divider { position: absolute; left: 0; right: 0; height: 10px; margin-top: -5px; background: #fff;
             box-shadow: 0 0 24px rgba(0,0,0,.6); z-index: 4; }

  #caps { z-index: 6; pointer-events: none; }
  .cap { position: absolute; left: 540px; text-align: center; opacity: 0; }
  .pill { font: 400 66px/1.12 Anton, sans-serif; color: #111; background: #fff; padding: 18px 40px 22px;
          border-radius: 28px; box-shadow: 0 10px 0 #111; white-space: nowrap; letter-spacing: .01em; }
  .big  { font: 400 200px/1 Anton, sans-serif; color: #ffd23f; letter-spacing: .02em; white-space: nowrap;
          -webkit-text-stroke: 10px #111; paint-order: stroke fill; text-shadow: 0 14px 0 #111; }
  .boom { font: 400 170px/1 Anton, sans-serif; color: #ff4d6d; white-space: nowrap;
          -webkit-text-stroke: 10px #fff; paint-order: stroke fill; text-shadow: 0 12px 0 #111; }
  .count { font: 400 300px/1 Anton, sans-serif; color: #fff; -webkit-text-stroke: 12px #111; paint-order: stroke fill; }
  .title { display: flex; flex-direction: column; align-items: center; }
  .title .k { font: 600 40px/1 Montserrat, sans-serif; letter-spacing: .45em; color: #111; background: #ffd23f;
              padding: 14px 18px 14px 36px; border-radius: 14px; white-space: nowrap; }
  .title .t { font: 400 190px/.95 'Bebas Neue', sans-serif; color: #fff; margin-top: 16px; white-space: nowrap;
              -webkit-text-stroke: 8px #111; paint-order: stroke fill; text-shadow: 0 12px 0 #111; }
</style>
</head>
<body>
<div id="mg-root">
  <div class="layer" id="backdrop"></div>
  <div class="layer"><canvas id="gl"></canvas></div>
  <div class="layer" id="vignette"></div>
  <div id="divider"></div>
  <div class="layer" id="caps"></div>
</div>

<script type="module">
import { MG, gsap } from './runtime/mg.js';
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1080, H = 1920, DUR = 60;
MG.config({ width: W, height: H, fps: 30, duration: DUR, background: '#120f18' });
const tl = MG.tl;

// ---------- renderer: one canvas, two cameras (split screen) ----------
const canvas = document.querySelector('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio || 1);   // follows --scale for fast drafts
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const key = new THREE.DirectionalLight('#ffe9cf', 2.4);
key.position.set(1.6, 3.2, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -1.5, right: 1.5, top: 1.5, bottom: -1.5, near: 0.5, far: 8 });
key.shadow.radius = 4; key.shadow.bias = -0.0006;
scene.add(key);
scene.add(new THREE.HemisphereLight('#d9d2ff', '#2a1f1a', 0.55));
const rim = new THREE.DirectionalLight('#ff8fd0', 1.4);
rim.position.set(-2, 1.5, -2.5);
scene.add(rim);

const camA = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
const camB = new THREE.PerspectiveCamera(32, 1, 0.01, 50);
const A = { x: 1, y: 1, z: 2, tx: 0, ty: 0, tz: 0, fov: 30, shake: 0 };
const B = { x: 1, y: 1, z: 2, tx: 0, ty: 0, tz: 0, fov: 32, shake: 0 };
const view = { split: 0.5 };

// ---------- materials ----------
const M = {
  black: new THREE.MeshPhysicalMaterial({ color: '#25232b', roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.15 }),
  ivory: new THREE.MeshPhysicalMaterial({ color: '#e2cfae', roughness: 0.35, clearcoat: 0.8 }),
  gold:  new THREE.MeshStandardMaterial({ color: '#e7b545', metalness: 1, roughness: 0.25 }),
  white: new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.2 }),
  pupil: new THREE.MeshStandardMaterial({ color: '#0a0a0a', roughness: 0.1 }),
  brow:  new THREE.MeshStandardMaterial({ color: '#111111', roughness: 0.6 }),
  browL: new THREE.MeshStandardMaterial({ color: '#f2efe8', roughness: 0.6 }),
  sqL:   new THREE.MeshStandardMaterial({ color: '#ecdcbc', roughness: 0.55 }),
  sqD:   new THREE.MeshStandardMaterial({ color: '#6e4a2e', roughness: 0.5 }),
  frame: new THREE.MeshStandardMaterial({ color: '#3b2516', roughness: 0.45 }),
  table: new THREE.MeshStandardMaterial({ color: '#4a3a5c', roughness: 0.8 }),
  pink:  new THREE.MeshStandardMaterial({ color: '#ff8fa6', roughness: 0.5 }),
  sweat: new THREE.MeshPhysicalMaterial({ color: '#8fd3ff', roughness: 0.05, transmission: 0.3, transparent: true, opacity: 0 }),
  flame: new THREE.MeshBasicMaterial({ color: '#ff7a1a', transparent: true, opacity: 0.95 }),
  flameIn: new THREE.MeshBasicMaterial({ color: '#ffe066' }),
  star:  new THREE.MeshBasicMaterial({ color: '#ffd23f' }),
  bulb:  new THREE.MeshBasicMaterial({ color: '#fff3c4' }),
  shade: new THREE.MeshStandardMaterial({ color: '#ffcf5a', roughness: 0.4, side: THREE.DoubleSide }),
  cord:  new THREE.MeshStandardMaterial({ color: '#111' }),
};
const mesh = (geo, mat, cast = true) => { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; return m; };
const lathe = (pts, mat) => mesh(new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), 40), mat);

// ---------- board ----------
const S = 0.25;
const board = new THREE.Group();
scene.add(board);
const tableTop = mesh(new THREE.BoxGeometry(5, 0.12, 3.4), M.table, false);
tableTop.position.y = -0.1;
scene.add(tableTop);
const frame = mesh(new THREE.BoxGeometry(2.2, 0.05, 2.2), M.frame);
frame.position.y = -0.035;
board.add(frame);
const sqGeo = new THREE.BoxGeometry(S, 0.014, S);
for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
  const q = mesh(sqGeo, (i + j) % 2 ? M.sqD : M.sqL, false);
  q.position.set((i - 3.5) * S, -0.007, (j - 3.5) * S);
  board.add(q);
}

// ---------- faces ----------
function makeFace(parent, { hy, hr, er = 0.02, sep = 0.027, y = hy + 0.01, browMat = M.brow }) {
  const st = { open: 1, openL: 1, openR: 1, px: 0, py: 0, brow: 0, browY: 0, dizzy: 0 };
  const parts = [];
  for (const side of [-1, 1]) {
    const x = side * sep;
    const z = Math.sqrt(Math.max(hr * hr - x * x - (y - hy) ** 2, 0)) - er * 0.25;
    const g = new THREE.Group();
    g.position.set(x, y, z);
    const eye = mesh(new THREE.SphereGeometry(er, 24, 16), M.white, false);
    const pupil = mesh(new THREE.SphereGeometry(er * 0.55, 16, 12), M.pupil, false);
    eye.add(pupil);
    const brow = mesh(new THREE.BoxGeometry(er * 1.8, er * 0.38, er * 0.5), browMat, false);
    g.add(eye, brow);
    parent.add(g);
    parts.push({ side, eye, pupil, brow });
  }
  const update = (t) => {
    for (const p of parts) {
      const o = st.open * (p.side < 0 ? st.openL : st.openR);
      p.eye.scale.set(1, Math.max(o, 0.06), 1);
      const dx = st.dizzy * Math.cos(t * 9 + (p.side < 0 ? 0 : 1.2));
      const dy = st.dizzy * Math.sin(t * 9 + (p.side < 0 ? 0 : 1.2));
      p.pupil.position.set((st.px + dx) * er * 0.38, (st.py + dy) * er * 0.38, er * 0.62);
      p.brow.rotation.z = p.side * st.brow;
      p.brow.position.set(0, er * 1.45 + st.browY, er * 0.25);
    }
  };
  return { st, update };
}

// ---------- pieces ----------
const BASE = [[0, 0], [0.085, 0], [0.085, 0.018], [0.072, 0.032], [0.076, 0.046], [0.058, 0.07], [0, 0.07]];
function king() {
  const g = new THREE.Group();
  g.add(lathe(BASE, M.black));
  const torso = new THREE.Group(); torso.position.y = 0.07; g.add(torso);
  const tg = new THREE.CylinderGeometry(0.043, 0.06, 0.13, 36); tg.translate(0, 0.065, 0);
  torso.add(mesh(tg, M.black));
  const upper = new THREE.Group(); g.add(upper);
  const collar = mesh(new THREE.TorusGeometry(0.05, 0.014, 12, 36), M.black); collar.rotation.x = Math.PI / 2; collar.position.y = 0.205;
  const head = mesh(new THREE.SphereGeometry(0.074, 36, 24), M.black); head.position.y = 0.285;
  upper.add(collar, head);
  const face = makeFace(upper, { hy: 0.285, hr: 0.074, er: 0.022, sep: 0.028, browMat: M.browL });
  const crown = new THREE.Group(); upper.add(crown);
  const band = mesh(new THREE.CylinderGeometry(0.05, 0.042, 0.035, 28), M.gold); band.position.y = 0.352;
  const c1 = mesh(new THREE.BoxGeometry(0.022, 0.08, 0.022), M.gold); c1.position.y = 0.405;
  const c2 = mesh(new THREE.BoxGeometry(0.06, 0.022, 0.022), M.gold); c2.position.y = 0.415;
  crown.add(band, c1, c2);
  // disguise: glasses + nose + moustache
  const dis = new THREE.Group(); dis.position.set(0, 0.295, 0.072); dis.scale.setScalar(0.001); upper.add(dis);
  for (const s of [-1, 1]) {
    const ring = mesh(new THREE.TorusGeometry(0.024, 0.0055, 10, 28), M.brow, false); ring.position.set(s * 0.028, 0, 0.012);
    const m = mesh(new THREE.SphereGeometry(0.022, 16, 12), M.browL, false); m.scale.set(1.3, 0.5, 0.6); m.position.set(s * 0.02, -0.05, 0.012);
    dis.add(ring, m);
  }
  const bridge = mesh(new THREE.BoxGeometry(0.012, 0.005, 0.005), M.brow, false); bridge.position.set(0, 0.004, 0.014);
  const nose = mesh(new THREE.SphereGeometry(0.02, 16, 12), M.pink, false); nose.position.set(0, -0.025, 0.026);
  dis.add(bridge, nose);
  const sweat = new THREE.Mesh(new THREE.SphereGeometry(0.012, 16, 12), M.sweat);
  sweat.scale.set(1, 1.6, 1); sweat.position.set(0.07, 0.33, 0.03); upper.add(sweat);
  const st = { squash: 1, wobble: 0 };
  return { g, torso, upper, head, face, crown, dis, sweat, st };
}
function queen() {
  const g = new THREE.Group();
  g.add(lathe(BASE, M.ivory));
  const tg = new THREE.CylinderGeometry(0.04, 0.058, 0.12, 36); tg.translate(0, 0.13, 0);
  g.add(mesh(tg, M.ivory));
  const collar = mesh(new THREE.TorusGeometry(0.047, 0.013, 12, 36), M.ivory); collar.rotation.x = Math.PI / 2; collar.position.y = 0.195;
  const head = mesh(new THREE.SphereGeometry(0.068, 36, 24), M.ivory); head.position.y = 0.27;
  g.add(collar, head);
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    const b = mesh(new THREE.SphereGeometry(0.014, 12, 10), M.gold);
    b.position.set(Math.sin(a) * 0.045, 0.34, Math.cos(a) * 0.045);
    g.add(b);
  }
  const ring = mesh(new THREE.TorusGeometry(0.045, 0.008, 8, 32), M.gold); ring.rotation.x = Math.PI / 2; ring.position.y = 0.328;
  const top = mesh(new THREE.SphereGeometry(0.018, 16, 12), M.gold); top.position.y = 0.365;
  g.add(ring, top);
  const face = makeFace(g, { hy: 0.27, hr: 0.068, er: 0.02, sep: 0.026 });
  return { g, face };
}
function pawn(mat, withFace = false) {
  const g = new THREE.Group();
  g.add(lathe([[0, 0], [0.07, 0], [0.07, 0.016], [0.06, 0.028], [0.062, 0.04], [0.045, 0.055], [0, 0.055]], mat));
  const tg = new THREE.CylinderGeometry(0.028, 0.045, 0.08, 28); tg.translate(0, 0.095, 0);
  g.add(mesh(tg, mat));
  const collar = mesh(new THREE.TorusGeometry(0.034, 0.01, 10, 28), mat); collar.rotation.x = Math.PI / 2; collar.position.y = 0.135;
  const head = mesh(new THREE.SphereGeometry(0.05, 28, 20), mat); head.position.y = 0.18;
  g.add(collar, head);
  const face = withFace ? makeFace(g, { hy: 0.18, hr: 0.05, er: 0.014, sep: 0.019 }) : null;
  return { g, face };
}
function rook(mat) {
  const g = new THREE.Group();
  g.add(lathe(BASE, mat));
  const tg = new THREE.CylinderGeometry(0.048, 0.06, 0.15, 32); tg.translate(0, 0.145, 0);
  g.add(mesh(tg, mat));
  const top = mesh(new THREE.CylinderGeometry(0.062, 0.055, 0.05, 32), mat); top.position.y = 0.245; g.add(top);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const c = mesh(new THREE.BoxGeometry(0.03, 0.03, 0.03), mat); c.position.set(Math.sin(a) * 0.045, 0.285, Math.cos(a) * 0.045); g.add(c);
  }
  return { g };
}
function bishop(mat) {
  const g = new THREE.Group();
  g.add(lathe(BASE, mat));
  const tg = new THREE.CylinderGeometry(0.034, 0.055, 0.15, 32); tg.translate(0, 0.145, 0);
  g.add(mesh(tg, mat));
  const hd = mesh(new THREE.SphereGeometry(0.05, 28, 20), mat); hd.scale.y = 1.35; hd.position.y = 0.27; g.add(hd);
  const tp = mesh(new THREE.SphereGeometry(0.015, 12, 10), mat); tp.position.y = 0.345; g.add(tp);
  return { g };
}
const sq = (c) => c; // board coords are already in world units (square centres = ±0.125, ±0.375 …)

const K = king();  board.add(K.g); K.g.position.set(0.125, 0, -0.375);
const Q = queen(); board.add(Q.g); Q.g.position.set(0.125, 0.5, -0.125); Q.g.rotation.y = Math.PI;
const P = pawn(M.ivory, true); board.add(P.g); P.g.position.set(0.375, 0, -0.375); P.g.rotation.y = Math.PI;

const extras = [];
const place = (piece, x, z, ry = 0) => { board.add(piece.g); piece.g.position.set(x, 0, z); piece.g.rotation.y = ry; extras.push(piece.g); };
place(pawn(M.black), -0.875, -0.625);
place(pawn(M.black), -0.625, -0.625);
place(pawn(M.black), -0.375, -0.875);
place(rook(M.black), -0.875, -0.875);
place(bishop(M.black), -0.375, -0.375);
place(bishop(M.ivory), -0.375, 0.375);
place(pawn(M.ivory), -0.625, 0.625);
place(pawn(M.ivory), 0.625, 0.625);
place(pawn(M.ivory), 0.875, 0.375);
place(rook(M.ivory), 0.875, 0.875);
place(pawn(M.black), -0.125, -0.875);

// ---------- lamp (for the rocket gag) ----------
const lampPivot = new THREE.Group(); lampPivot.position.set(0.375, 3.2, -0.625); scene.add(lampPivot);
const cord = mesh(new THREE.CylinderGeometry(0.006, 0.006, 1.45, 8), M.cord, false); cord.position.y = -0.725; lampPivot.add(cord);
const shade = mesh(new THREE.ConeGeometry(0.2, 0.17, 40, 1, true), M.shade, false); shade.position.y = -1.53; lampPivot.add(shade);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 20, 14), M.bulb); bulb.position.y = -1.6; lampPivot.add(bulb);
const lampLight = new THREE.PointLight('#ffd89a', 1.2, 4, 1.5); lampLight.position.y = -1.65; lampPivot.add(lampLight);
let BONK = 999;

// ---------- rocket flame + smoke ----------
const flame = new THREE.Group(); flame.scale.setScalar(0.001); K.g.add(flame);
const fo = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.22, 24), M.flame); fo.rotation.x = Math.PI; fo.position.y = -0.11;
const fi = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.13, 20), M.flameIn); fi.rotation.x = Math.PI; fi.position.y = -0.07;
flame.add(fo, fi);
const fx = { flame: 0, smoke: 0, stars: 0, bounce: 0 };
const puffs = [];
const smokeMat = new THREE.MeshStandardMaterial({ color: '#cfcad8', roughness: 1, transparent: true, opacity: 0 });
const rnd = MG.rand(11);
for (let i = 0; i < 14; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.05, 14, 10), smokeMat.clone());
  m.userData = { a: rnd() * Math.PI * 2, s: 0.6 + rnd() * 0.8, o: i / 14 };
  scene.add(m); puffs.push(m);
}
const stars = [];
const starGeo = new THREE.OctahedronGeometry(0.02, 0);
for (let i = 0; i < 5; i++) { const s = new THREE.Mesh(starGeo, M.star); s.visible = false; scene.add(s); stars.push(s); }

// ---------- per-frame updates ----------
const tmp = new THREE.Vector3();
function applyCam(cam, c, aspect, t) {
  const sx = c.shake * (Math.sin(t * 61) * 0.6 + Math.sin(t * 37) * 0.4);
  const sy = c.shake * (Math.cos(t * 53) * 0.6 + Math.sin(t * 29) * 0.4);
  cam.position.set(c.x + sx, c.y + sy, c.z);
  cam.lookAt(c.tx + sx * 0.5, c.ty + sy * 0.5, c.tz);
  cam.fov = c.fov; cam.aspect = aspect; cam.updateProjectionMatrix();
}
MG.onFrame((t) => {
  // squash king: torso shrinks, head drops with it
  K.torso.scale.y = K.st.squash;
  K.upper.position.y = -0.13 * (1 - K.st.squash);
  K.g.rotation.z = K.st.wobble * Math.sin(t * 6) * 0.18;
  K.face.update(t); Q.face.update(t); P.face.update(t);

  // flame flicker
  const f = fx.flame * (1 + 0.18 * Math.sin(t * 47) + 0.1 * Math.sin(t * 83));
  flame.scale.set(fx.flame || 0.001, f || 0.001, fx.flame || 0.001);
  K.g.getWorldPosition(tmp);
  for (const p of puffs) {
    const u = p.userData;
    const ph = ((t * 1.3 + u.o) % 1);
    const r = 0.05 + ph * 0.35 * u.s;
    p.position.set(tmp.x + Math.cos(u.a) * r, 0.03 + ph * 0.12, tmp.z + Math.sin(u.a) * r);
    p.scale.setScalar(0.6 + ph * 1.6 * u.s);
    p.material.opacity = fx.smoke * (1 - ph) * 0.7;
    p.visible = fx.smoke > 0.01;
  }
  // dizzy stars orbit the king's head wherever it is
  K.head.getWorldPosition(tmp);
  stars.forEach((s, i) => {
    const a = t * 4 + (i / 5) * Math.PI * 2;
    s.visible = fx.stars > 0.01;
    s.position.set(tmp.x + Math.cos(a) * 0.11, tmp.y + 0.1 + Math.sin(a * 2) * 0.01, tmp.z + Math.sin(a) * 0.11);
    s.rotation.set(t * 3, t * 5, 0);
    s.scale.setScalar(fx.stars || 0.001);
  });
  // lamp swings after the bonk
  const dt = t - BONK;
  lampPivot.rotation.z = dt > 0 ? 0.32 * Math.exp(-dt * 0.18) * Math.sin(dt * 2.6) : 0;
  lampPivot.rotation.x = dt > 0 ? 0.12 * Math.exp(-dt * 0.2) * Math.sin(dt * 2.1 + 0.6) : 0;
  board.position.y = fx.bounce;

  // split-screen render
  renderer.setScissorTest(true);
  renderer.clear();
  const sp = view.split;
  if (sp >= 0.999) {
    renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H);
    applyCam(camA, A, W / H, t); renderer.render(scene, camA);
  } else {
    const hTop = Math.round(H * sp), hBot = H - hTop;
    renderer.setViewport(0, hBot, W, hTop); renderer.setScissor(0, hBot, W, hTop);
    applyCam(camA, A, W / hTop, t); renderer.render(scene, camA);
    renderer.setViewport(0, 0, W, hBot); renderer.setScissor(0, 0, W, hBot);
    applyCam(camB, B, W / hBot, t); renderer.render(scene, camB);
  }
  const div = document.getElementById('divider');
  div.style.top = H * sp + 'px';
  div.style.display = sp >= 0.999 ? 'none' : 'block';
});

// ---------- shot helpers ----------
const wide = (x, z, d = 1) => ({ x: x + 0.75 * d, y: 1.0 * d, z: z + 1.65 * d, tx: x, ty: 0.12, tz: z, fov: 30 });
const kingCU = (x, z) => ({ x: x + 0.27, y: 0.36, z: z + 0.52, tx: x, ty: 0.3, tz: z, fov: 32 });
const queenCU = (x, z) => ({ x: x - 0.27, y: 0.34, z: z - 0.52, tx: x, ty: 0.28, tz: z, fov: 32 });
const cut = (t, cam, shot) => tl.set(cam, shot, t);
const splitAt = (t, v) => tl.set(view, { split: v }, t);
const shakeAt = (t, cam, amp = 0.025, d = 0.6) => tl.fromTo(cam, { shake: amp }, { shake: 0, duration: d, ease: 'power2.out', immediateRender: false }, t);

// ---------- captions ----------

  el.innerHTML = html;
  el.style.top = y + 'px';
  if (opts.x) el.style.left = opts.x + 'px';
  capsEl.appendChild(el);
  gsap.set(el, { xPercent: -50, yPercent: -50 });
  const rot = opts.rot || 0;
  const start = t0 === 0 ? { opacity: 1, scale: 1.25, rotation: rot } : { opacity: 0, scale: 0.4, rotation: rot - 8 };
  tl.fromTo(el, start, { opacity: 1, scale: 1, rotation: rot, duration: 0.35, ease: 'punch', immediateRender: t0 === 0 }, t0);
  tl.to(el, { opacity: 0, scale: 0.9, duration: 0.2, ease: 'power1.in' }, t1 - 0.2);
  return el;
}
